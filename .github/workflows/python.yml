on:
  workflow_dispatch:
  push:
    paths:
    - 'impl/python/**'
    - 'impl/rust/**'
    - 'table.tsv'
    - '.github/workflows/python.yml'
    - '.github/scripts/build_and_test_universal_wheel.sh'
  pull_request:
    paths:
    - 'impl/python/**'
    - 'impl/rust/**'
    - 'table.tsv'
    - '.github/workflows/python.yml'
    - '.github/scripts/build_and_test_universal_wheel.sh'

defaults:
  run:
    working-directory: ./impl/python

env:
  MATURIN_VERSION: '1.16.0'

jobs:
  python-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pytest ruff build maturin==${{ env.MATURIN_VERSION }}
      - run: python -m pytest
      - run: ruff check --diff .
      - run: ruff format --diff .
      - run: bash "$GITHUB_WORKSPACE/.github/scripts/build_and_test_universal_wheel.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: python-universal
          path: impl/python/dist/*
  python:
    runs-on: ubuntu-22.04
    env:
      PIP_TRUSTED_HOST: "pypi.python.org pypi.org files.pythonhosted.org"
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.7', '3.9', '3.11' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest
  python-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - os: macos-15-intel
          - os: macos-15
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        with:
          maturin-version: v${{ env.MATURIN_VERSION }}
          rust-toolchain: stable
          working-directory: impl/python
          container: ${{ matrix.container }}
          manylinux: '2_28'
          args: >-
            --release --locked --out dist-native
            --interpreter ${{ runner.os == 'Linux' && '/opt/python/cp310-cp310/bin/python' || 'python' }}
      - run: python -m pip install abi3audit pytest
      - run: abi3audit --strict --report dist-native/*.whl
        shell: bash
      - run: python -m pip install --no-index --find-links dist-native anyascii
      - run: python -I tests/check_wheel.py native ../../table.tsv
      - run: python -I -m pytest -q tests/test_anyascii.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m pip install --no-index --find-links dist-native anyascii
      - run: python -I tests/check_wheel.py native ../../table.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: python-native-${{ matrix.os }}
          path: impl/python/dist-native/*.whl
