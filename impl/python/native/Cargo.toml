[package]
name = "anyascii_python"
version = "0.0.0" # The wheel version comes from pyproject.toml.
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE.native"
publish = false

[lib]
name = "_transliterate"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
any_ascii = { path = "../../rust", features = ["fallible"] }
# Free-threaded interpreters ignore the abi3 feature and get version-specific builds.
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
