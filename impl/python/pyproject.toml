[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "anyascii-rs"
version = "0.3.4"
description = "Rust-backed Unicode to ASCII transliteration (up to 25.9x as fast as anyascii 0.3.3 in benchmarks)"
authors = [{name = "Hunter WB", email = "hunter@hunterwb.com"}]
maintainers = [{name = "PLPeeters", email = "PLPeeters@users.noreply.github.com"}]
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
	"unicode",
	"ascii",
	"transliteration",
	"utf8",
	"romanization",
	"slug",
	"emoji",
	"unidecode",
	"normalization",
]
requires-python = ">=3.10"
classifiers = [
	"License :: OSI Approved :: ISC License (ISCL)",
	"Programming Language :: Python :: 3 :: Only",
	"Topic :: Text Processing :: General",
	"Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/PLPeeters/anyascii"
Demo = "https://anyascii.com"
Changelog = "https://github.com/PLPeeters/anyascii/blob/master/CHANGELOG.md"

[tool.flit.module]
name = "anyascii"

[tool.flit.sdist]
include = ["build_backend.py", "setup.py", "tests/"]
exclude = ["anyascii/_transliterate.*"]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "."
module-name = "anyascii._transliterate"
exclude = ["**/__pycache__/**"]

[tool.ruff.lint]
select = ["F", "E", "I"]
